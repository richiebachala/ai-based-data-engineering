name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python syntax check (all chapters)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python - << 'EOF'
          import ast, sys, pathlib

          files = sorted(
              f for f in pathlib.Path(".").rglob("*.py")
              if "__pycache__" not in str(f)
          )
          errors = []
          for f in files:
              try:
                  ast.parse(f.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  errors.append(f"FAIL  {f}:{e.lineno}  {e.msg}")

          if errors:
              print(f"\n{len(errors)} syntax error(s):\n")
              print("\n".join(errors))
              sys.exit(1)

          print(f"OK  {len(files)} files — all pass syntax check")
          EOF

      - name: Lint (pyflakes)
        run: |
          pip install --quiet pyflakes
          python -m pyflakes $(git ls-files '*.py')

      - name: Verify requirements files are parseable
        run: |
          pip install --quiet packaging
          python - << 'EOF'
          import sys
          from packaging.requirements import Requirement

          files = [
              "requirements.txt",
              "requirements-crewai.txt",
              "requirements-graphrag.txt",
          ]
          bad = []
          for name in files:
              for n, line in enumerate(open(name), 1):
                  spec = line.split("#", 1)[0].strip()
                  if not spec:
                      continue
                  try:
                      Requirement(spec)
                  except Exception as e:
                      bad.append(f"{name}:{n}  {spec}  ({e})")
          if bad:
              print("Unparseable lines:\n" + "\n".join(bad))
              sys.exit(1)
          print(f"OK  {len(files)} requirements files")
          EOF

      - name: Notebooks match their generator
        run: |
          python generate_ch3457_notebooks.py
          git diff --exit-code -- '*.ipynb'
