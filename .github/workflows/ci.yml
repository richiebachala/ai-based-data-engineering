name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python syntax check (all chapters)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python - << 'EOF'
          import ast, sys, pathlib

          files = sorted(
              f for f in pathlib.Path(".").rglob("*.py")
              if "__pycache__" not in str(f)
          )
          errors = []
          for f in files:
              try:
                  ast.parse(f.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  errors.append(f"FAIL  {f}:{e.lineno}  {e.msg}")

          if errors:
              print(f"\n{len(errors)} syntax error(s):\n")
              print("\n".join(errors))
              sys.exit(1)

          print(f"OK  {len(files)} files — all pass syntax check")
          EOF

      - name: Verify requirements.txt is parseable
        run: python -c "
          import re, sys
          lines = open('requirements.txt').readlines()
          bad = [l.strip() for l in lines if l.strip() and not l.startswith('#') and not re.match(r'[\w\-\.\[\]]+', l.strip())]
          if bad:
              print('Unparseable lines:', bad); sys.exit(1)
          print(f'OK  requirements.txt ({len(lines)} lines)')
          "
